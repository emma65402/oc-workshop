<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界觀與角色工坊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap">
<style>
:root{--bg:#f8f4fc;--panel:#fff;--ink:#2e2838;--mute:#7d7390;--line:#e4d9f0;--acc:#6b4a96;--accbg:#efe7f8;--main:#baa0d6;--onmain:#2e2838;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a27;--panel:#2a2433;--ink:#eee8f5;--mute:#a99dbd;--line:#3d3449;--acc:#cdb6e8;--accbg:#3a2f4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a27;--panel:#2a2433;--ink:#eee8f5;--mute:#a99dbd;--line:#3d3449;--acc:#cdb6e8;--accbg:#3a2f4b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 'LXGW WenKai TC','霄騖文楷 TC','Noto Serif TC','Songti TC','PMingLiU',serif}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--accbg)}
.row{display:flex;gap:6px;align-items:center}
h1{font-size:16px;margin:0;flex:1;letter-spacing:.05em;color:var(--acc)}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input,textarea,select{width:100%}
textarea{resize:vertical;line-height:1.6}
button{cursor:pointer;width:auto}
button:hover{border-color:var(--acc)}
button.pri{background:var(--main);color:var(--onmain);border-color:var(--main)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px}
.chip.on{background:var(--main);border-color:var(--main);color:var(--onmain)}
.list{overflow:auto;flex:1}
.item{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.item.on{background:var(--accbg);box-shadow:inset 3px 0 var(--main)}
.item small{color:var(--mute);display:block;font-size:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-weight:600}
.av img{width:100%;height:100%;object-fit:cover}
.main{overflow:auto;padding:22px;min-width:0}
.card{max-width:760px;margin:0 auto}
.empty{color:var(--mute);text-align:center;margin-top:20vh}
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.portrait{width:160px;max-width:100%;border-radius:12px;border:1px solid var(--line)}
.head h2{margin:0 0 4px;font-size:26px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-right:4px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:14px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
dt{color:var(--mute)}dd{margin:0;white-space:pre-wrap}
.body h3,.body h4,.body h5{margin:1em 0 .3em;color:var(--acc)}
.body p{margin:.5em 0}
a.lk{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
a.lk.new{text-decoration-style:dashed;opacity:.75}
.back{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.acts{display:flex;gap:6px;margin-left:auto}
.frow{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.hint{font-size:12px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:4px 6px;font-size:13px}
.seg button.on{background:var(--main);color:var(--onmain)}
.gh{position:sticky;top:0;z-index:1;padding:6px 14px;background:var(--accbg);color:var(--acc);font-size:13px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--line)}
.gh span{color:var(--mute)}
.frow2{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.rgc{margin-bottom:16px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.frow3{display:grid;grid-template-columns:minmax(110px,1fr) 1fr auto;gap:6px;margin-bottom:6px}
img:not([src]){visibility:hidden}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0}
.gal img{width:100%;height:190px;object-fit:contain;background:var(--accbg);border:1px solid var(--line);border-radius:10px;cursor:zoom-in}
.gal figcaption{font-size:12px;color:var(--mute);text-align:center;margin-top:2px}
.gi{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.gi img{width:90px;height:90px;object-fit:contain;background:var(--accbg);border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(20,15,30,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;font-size:14px}
#toast.on{opacity:1}
[hidden]{display:none!important}
.shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.nav{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.06em;color:var(--acc);white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tab{border:0;background:transparent;border-radius:99px;padding:6px 14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--main);color:var(--onmain)}
.navr{display:flex;gap:6px}
.view{min-height:0;overflow:auto;padding:16px}
.view.fill{padding:10px;overflow:hidden}
.view.col{display:flex;flex-direction:column}
.mback{display:none}
.sm{position:relative;height:100%;border-radius:14px;overflow:hidden;background:#17122a;border:1px solid var(--line)}
.sm canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.smbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.smbar>*{pointer-events:auto}
.smbar select,.smbar button{width:auto;background:rgba(30,22,52,.8);color:#f3ecff;border-color:rgba(186,160,214,.45)}
.smp{position:absolute;left:10px;bottom:10px;max-width:min(340px,calc(100% - 20px));background:rgba(30,22,52,.84);color:#f3ecff;border:1px solid rgba(186,160,214,.4);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
.smp button{background:rgba(186,160,214,.22);color:#f3ecff;border-color:rgba(186,160,214,.45)}
.smh{font-size:12px;color:#c9bbe0}
.smrel{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.smc{font-size:12px;padding:2px 9px;border-radius:99px}
.smleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:12px}
.smleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.tl{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.tlbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tlbar select,.tlbar input{width:auto}
.tlbody{flex:1;min-height:200px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:flex-start}
.tllabs{width:116px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line)}
.tlin{position:relative;flex:none}
.tlh{height:30px;position:relative;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.tk{position:absolute;top:6px;transform:translateX(-50%)}
.tgrid{position:absolute;left:0;right:0;top:30px;bottom:0;pointer-events:none}
.tgrid i{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.tll{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;overflow:hidden}
.tll small{display:block;color:var(--mute)}
.tlt{position:relative;border-bottom:1px solid var(--line)}
.ev{position:absolute;height:28px;padding:0 10px;border-radius:99px;background:var(--accbg);border:1px solid var(--main);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
.ev.rng{border-radius:8px;background:var(--main);color:var(--onmain)}
.ev.on{box-shadow:0 0 0 3px var(--acc)}
.tled{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:45%;overflow:auto}
.co{max-width:980px;margin:0 auto}
.cards{columns:260px;column-gap:12px}
.cc{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.cct{display:block;font-weight:600;margin:6px 0;word-break:break-all}
a.cct{color:var(--acc)}
.ccb{white-space:pre-wrap;font-size:14px;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.wr{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;height:100%;min-height:0}
.wlist{overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:0}
.wed{display:flex;flex-direction:column;gap:8px;min-height:0}
#wta{flex:1;min-height:260px;resize:none;font:17px/1.9 'LXGW WenKai TC','霄騖文楷 TC','Noto Serif TC',serif;padding:16px 18px;background:var(--panel)}
#wbody{flex:1;min-height:0;overflow:auto}
.wst{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.pbar{flex:1;min-width:80px;height:6px;border-radius:9px;background:var(--accbg);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--main)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--mute)}
.stat b{font-size:20px;color:var(--acc)}
.heat{overflow-x:auto;padding:6px 0}
.hg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;width:max-content}
.hc{display:block;border-radius:3px;background:var(--accbg);cursor:pointer}
.hc.l1{background:var(--main);opacity:.35}
.hc.l2{background:var(--main);opacity:.6}
.hc.l3{background:var(--main);opacity:.85}
.hc.l4{background:var(--main)}
.hc.sel{outline:2px solid var(--acc)}
.hc.fut{visibility:hidden}
.tllabs{width:150px}
.tll{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 8px}
.tll.off{opacity:.45}
.tlr{display:flex;align-items:center;gap:4px;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.tnm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.tnm{padding:2px 6px;width:100%}
.mini{padding:0 6px;font-size:12px;line-height:20px;border-radius:6px}
.mini.on{background:var(--main);color:var(--onmain);border-color:var(--main)}
.tll small{margin-left:auto}
.tlt.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--accbg) 6px 12px)}
.ev{touch-action:none;background:hsl(var(--h) 60% 82%);border-color:hsl(var(--h) 50% 50%);color:#2e2838;padding-right:14px;cursor:grab}
.ev.rng{background:hsl(var(--h) 60% 82%);color:#2e2838}
.ev .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:hsl(var(--h) 50% 50%);opacity:.5}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ff5d7a;z-index:2;pointer-events:none}
.phh{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;background:#ff5d7a;clip-path:polygon(0 0,100% 0,50% 100%);cursor:ew-resize}
.tlh.rul{cursor:ew-resize}
.tlbar .sp{flex:1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:120px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.book .bt{font-weight:700;color:var(--acc)}
.book.new{align-items:center;justify-content:center;color:var(--mute);border-style:dashed}
.ed{--eb:#ece6f5;--es:#e1d8ef;--ei:#2b2536;--em:#7d7390;--el:#cfc2e3;--ea:#6b4a96;--ec:#baa0d6;position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr);background:var(--eb);color:var(--ei);padding-top:env(safe-area-inset-top,0px);font-size:14px}
.ed.lo{grid-template-columns:250px minmax(0,1fr) 0}
.ed.ro{grid-template-columns:0 minmax(0,1fr) 320px}
.ed.lo.ro{grid-template-columns:250px minmax(0,1fr) 320px}
.ed.zen{grid-template-columns:0 minmax(0,1fr) 0!important}
.ed.zen .eds,.ed.zen .edr,.ed.zen .edtb,.ed.zen .edol{display:none}
.ed.dk{--eb:#1b1625;--es:#15111d;--ei:#e9e3f2;--em:#9a90ad;--el:#322a40;--ea:#cbb2ea;--ec:#8d6fbb}
.ed .sp{flex:1}
.ed button,.ed input,.ed select,.ed textarea{color:var(--ei)}
.ed input,.ed select,.ed textarea{background:var(--eb);border-color:var(--el)}
.ed button{background:transparent;border-color:transparent}
.ed a{cursor:pointer}
.ed .eds{grid-column:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--es);border-right:1px solid var(--el)}
.ed:not(.lo) .eds,.ed:not(.ro) .edr{display:none}
.ed .edr{grid-column:3;background:var(--es);border-left:1px solid var(--el);overflow:auto;min-width:0}
.ed .edm{grid-column:2;display:grid;grid-template-rows:42px minmax(0,1fr) 38px;min-width:0;position:relative}
.ed .edh{height:42px;display:flex;align-items:center;padding:0 10px;flex:none}
.ed .ib{padding:2px 8px;font-size:15px;border-radius:6px}
.ed .ib:hover{background:var(--el)}
.ed .edtabs{display:flex;gap:2px;padding:0 10px 6px;font-size:12px;flex:none}
.ed .edtabs button{color:var(--em);padding:3px 6px;border-radius:6px}
.ed .edtabs button.on{color:var(--ea);font-weight:700}
.ed .edlist{flex:1;min-height:80px;overflow:auto;padding:0 6px}
.ed .edops{display:flex;gap:6px;padding:6px 4px 10px;align-items:center}
.ed .edops button{font-size:12px;padding:4px 10px;background:var(--eb);border:1px solid var(--el)}
.ed .ci,.ed .vh,.ed .mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ea)}
.ed .ci>span,.ed .mi>span,.ed .vh>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed .ci em,.ed .vh em{font-style:normal;color:var(--em);font-size:12px}
.ed .ci.on,.ed .mi.on{background:var(--el)}
.ed .ci.ghost{color:var(--em)}
.ed .vh{color:var(--ei);font-weight:600}
.ed .mi{color:var(--ei)}
.ed .edbook{display:flex;align-items:center;padding:6px 12px;color:var(--em);font-size:12px;border-top:1px solid var(--el);flex:none}
.ed .edbook .bt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed .edmat{flex:none;max-height:38%;display:flex;flex-direction:column;border-top:1px solid var(--el)}
.ed .edmh{display:flex;align-items:center;gap:4px;padding:10px 10px 4px}
.ed .edmatl{overflow:auto;padding:0 6px 8px}
.ed .plus{background:var(--ec);color:#2e2838;width:26px;height:26px;border-radius:50%;padding:0;font-size:18px;line-height:24px}
.ed .edtb{display:flex;align-items:flex-end;gap:4px;padding:6px 10px 0;overflow-x:auto;min-width:0}
.ed .tb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px 8px 0 0;color:var(--em);font-size:12px;cursor:pointer;max-width:180px;white-space:nowrap}
.ed .tb.on{background:var(--es);color:var(--ei)}
.ed .tb span{overflow:hidden;text-overflow:ellipsis}
.ed .tx{padding:0 2px;font-size:11px;opacity:.6}
.ed .edc{display:flex;flex-direction:column;min-height:0;padding:12px 28px 0;overflow:hidden}
.ed .edol{display:flex;gap:10px;align-items:center;background:var(--es);border-radius:8px;padding:6px 12px;font-size:12px;max-width:var(--cw);width:100%;margin:0 auto 10px;flex:none}
.ed .edol a{color:var(--ea);font-weight:600}
.ed .olt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed .edtitle{border:0;background:transparent;font:700 34px/1.4 var(--ff);padding:6px 0;max-width:var(--cw);width:100%;margin:0 auto;outline:0;flex:none}
.ed #edta{flex:1;min-height:0;max-width:var(--cw);width:100%;margin:0 auto;border:0;background:transparent;resize:none;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);outline:0;padding:6px 0 40px}
.ed .edst{display:flex;align-items:center;gap:10px;padding:0 20px;font-size:12px;color:var(--em)}
.ed .cn{position:absolute;bottom:40px;font-size:16px;padding:2px 8px;color:var(--em)}
.ed .cn.l{left:4px}
.ed .cn.r{right:4px}
.ed .rph{display:flex;align-items:center;padding:10px 12px}
.ed .rpb{padding:0 14px 16px}
.ed .edr dl{background:transparent;border-color:var(--el)}
.ed .pop{position:fixed;z-index:60;background:var(--eb);color:var(--ei);border:1px solid var(--el);border-radius:10px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.28);min-width:190px;display:flex;flex-direction:column;gap:6px}
.ed .pop button{text-align:left;padding:6px 10px;border-radius:6px}
.ed .pop button:hover{background:var(--el)}
.ed .pop button.pri{background:var(--ec);color:#2e2838}
.ed .pop label{display:block;font-size:12px;margin:0;color:var(--em)}
@media (max-width:720px){
.ed,.ed.lo,.ed.ro,.ed.lo.ro,.ed.zen{grid-template-columns:minmax(0,1fr)!important}
.ed .edm{grid-column:1}
.ed.lo .eds{position:fixed;left:0;top:0;bottom:0;width:min(86vw,300px);z-index:5;padding-top:env(safe-area-inset-top,0px);box-shadow:4px 0 20px rgba(0,0,0,.3)}
.ed.ro .edr{position:fixed;right:0;top:0;bottom:0;width:min(90vw,340px);z-index:5;padding-top:env(safe-area-inset-top,0px);box-shadow:-4px 0 20px rgba(0,0,0,.3)}
.ed .edc{padding:10px 14px 0}
.ed .edtitle{font-size:26px}
}
.tkp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tkm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tkm b{color:var(--acc)}
.tkh{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.tkh summary{cursor:pointer;color:var(--acc)}
.tkg{display:grid;gap:10px}
.lay-hats,.lay-scamper{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.lay-disney,.lay-umb{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lay-steps{grid-template-columns:1fr}
.lay-cornell{grid-template-columns:1fr 3fr;grid-template-areas:'cue note' 'sum sum'}
.tf-cue{grid-area:cue}
.tf-note{grid-area:note}
.tf-sum{grid-area:sum}
.lay-m3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lay-m3 .tg0{grid-column:1/-1}
.tg{display:flex;flex-direction:column;gap:8px}

<script>
const TYPES=["角色","地點","勢力","種族","歷史","設定","其他"];
const TPL={"角色":[],"地點":["位置","氣候"],"勢力":["領袖","據點"],"種族":["壽命","特徵"],"歷史":["年代"],"設定":[],"其他":[]};
const KEY="wb-v1",$=id=>document.getElementById(id);
let S={entries:[],sel:null,edit:false,filter:"全部",q:"",panel:null,confirm:false,group:"地區",col:{},regions:[],gm:"1",gc:null,tab:"info",gcat:"立繪",view:"lib"};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const unesc=s=>s.replace(/&quot;/g,'"').replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&");
const cur=()=>S.entries.find(e=>e.id===S.sel);
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.entries))S.entries=d.entries}catch(e){}
  if(!S.entries.length){
    S.entries=[];
  }
  S.sel=S.entries[0]?S.entries[0].id:null;
}
function save(){trkWatch('-entries',S.entries);try{localStorage.setItem(KEY,JSON.stringify({entries:S.entries}))}catch(e){toast("瀏覽器儲存空間已滿，變更可能沒有保存")}syncSoon();gReward()}
function link(n){
  const e=S.entries.find(x=>esc(x.name)===n);
  return e?`<a href="#" class="lk" data-id="${e.id}">${n}</a>`:`<a href="#" class="lk new" data-new="${n}">${n}</a>`;
}
function md(t){
  const inl=s=>s.replace(/\[\[([^\]]+)\]\]/g,(a,n)=>link(n)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  let out="",ul=false,m;
  for(const l of esc(t).split("\n")){
    if(m=l.match(/^(#{1,3})\s+(.*)/)){if(ul){out+="</ul>";ul=false}const h=m[1].length+2;out+=`<h${h}>${inl(m[2])}</h${h}>`}
    else if(m=l.match(/^[-*]\s+(.*)/)){if(!ul){out+="<ul>";ul=true}out+=`<li>${inl(m[1])}</li>`}
    else{if(ul){out+="</ul>";ul=false}if(l.trim())out+=`<p>${inl(l)}</p>`}
  }
  return out+(ul?"</ul>":"");
}
function avatar(e){return `<div class="av">${e.img?`<img src="${e.img}" alt="">`:esc((e.name||"?").slice(0,1))}</div>`}
function renderChips(){
  $("seg").innerHTML=["地區","家庭","勢力","類型","軼事"].map(g=>`<button data-grp="${g}"${S.group===g?' class="on"':""}>${g}</button>`).join("");
  $("chips").innerHTML=["全部",...TYPES].map(t=>`<button class="chip${S.filter===t?" on":""}" data-chip="${t}">${t}</button>`).join("");
  $("add").innerHTML=`<option value="">＋ 新增條目…</option>`+TYPES.map(t=>`<option>${t}</option>`).join("");
}
const GK={"地區":"region","家庭":"family","勢力":"faction"};
const REG0=[];
const SEEDS=[];
function addSeeds(){
  let done=[];try{done=JSON.parse(localStorage.getItem(KEY+"-seeded"))||[]}catch(e){}
  let add=false;
  SEEDS.forEach(s=>{if(done.includes(s.id))return;done.push(s.id);if(!S.entries.some(x=>x.id===s.id)){S.entries.push({region:"",family:"",faction:"",tags:[],img:"",fields:[],updated:Date.now(),...s});add=true}});
  if(add)save();
  try{localStorage.setItem(KEY+"-seeded",JSON.stringify(done))}catch(e){}
}
const hex=v=>{v=String(v||"").trim();const m=v.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);if(!m)return"";let h=m[1];if(h.length===3)h=h.split("").map(x=>x+x).join("");return"#"+h.toLowerCase()};
const txt=x=>x.body+" "+(x.persona||"")+" "+(x.anec||[]).map(a=>a.b).join(" ")+" "+x.fields.map(f=>f[1]).join(" ");
function ensureChar(e){if(!e.c)e.c={};if(e.persona===undefined)e.persona="";if(!Array.isArray(e.anec))e.anec=[];if(!Array.isArray(e.rels))e.rels=[];if(!Array.isArray(e.gal))e.gal=[];if(!Array.isArray(e.ec))e.ec=["","","","","",""]}
function charView(e){
  const c=e.c,sw=v=>v?`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${esc(hex(v)||"transparent")};border:1px solid var(--line);vertical-align:-2px;margin-right:5px"></span>${esc(v)}`:"";
  const rows=[["生日",dshow(c.birthday)],["性別",c.gender?esc(c.gender)+(c.gender==="無"&&c.appear?"（外觀"+esc(c.appear)+"）":""):""],["個性簽名",esc(c.sign)],["身分",esc(c.identity)],["髮色",sw(c.hair)],["瞳色",sw(c.eye)],["外貌",esc(c.look)],["喜歡的東西",esc(c.likes)],["討厭的東西",esc(c.dislikes)],["秘密",esc(c.secret)],["弱點",esc(c.weak)],["日常習慣與怪癖",esc(c.habits)]].filter(r=>r[1]);
  return rows.length?`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>`:"";
}
function charSections(e){
  const nil='<p class="hint">（尚未填寫）</p>';
  return `<div class="body"><h3>背景</h3>${md(e.body)||nil}<h3>人設</h3>${md(e.persona)||nil}<h3>軼事</h3>${e.anec.length?e.anec.map(a=>`<h4>${esc(a.t||"（無標題）")}</h4>${md(a.b)}`).join(""):nil}${echoView(e)}</div>`;
}
function charEdit(e){
  ensureChar(e);const c=e.c,R='<div class="row" style="flex-wrap:wrap;align-items:flex-start">';
  const ip=(k,l)=>`<label>${l}</label><input data-f="c.${k}" value="${esc(c[k])}">`;
  const ta=(k,l)=>`<div style="flex:1;min-width:200px"><label>${l}</label><textarea data-f="c.${k}" rows="2">${esc(c[k])}</textarea></div>`;
  const col=(k,l)=>`<div style="flex:1;min-width:170px"><label>${l}</label><div class="row"><input type="color" data-f="c.${k}" value="${hex(c[k])||"#baa0d6"}" style="width:44px;height:34px;padding:2px;flex:none"><input data-f="c.${k}" value="${esc(c[k])}" placeholder="#rrggbb"></div></div>`;
  const so=(arr,v)=>arr.map(([a,b])=>`<option value="${a}"${a===v?" selected":""}>${b}</option>`).join("");
  const others=S.entries.filter(x=>x.type==="角色"&&x.id!==e.id);
  return `${R}<div style="flex:1;min-width:120px">${bdate(c.birthday)}</div><div style="flex:1;min-width:110px"><label>性別</label><select data-f="c.gender">${so([["","—"],["男","男"],["女","女"],["無","無"]],c.gender||"")}</select></div>${c.gender==="無"?`<div style="flex:1;min-width:110px"><label>外觀</label><select data-f="c.appear">${so([["","請選擇"],["男","外觀男"],["女","外觀女"]],c.appear||"")}</select></div>`:""}</div>
  ${ip("sign","個性簽名")}${ip("identity","身分")}
  ${R}${col("hair","髮色")}${col("eye","瞳色")}</div>
  ${R}${ta("look","外貌")}</div>${R}${ta("likes","喜歡的東西")}${ta("dislikes","討厭的東西")}</div>${R}${ta("secret","秘密")}${ta("weak","弱點")}</div>${R}${ta("habits","日常習慣與怪癖")}</div>
  <label>角色關係（會顯示在關係圖）</label>
  ${e.rels.map((r,i)=>`<div class="frow3"><select data-f="rt" data-i="${i}"><option value="">選擇角色</option>${others.map(o=>`<option value="${o.id}"${o.id===r.to?" selected":""}>${esc(o.name||"（未命名）")}</option>`).join("")}</select><input data-f="rl" data-i="${i}" value="${esc(r.l)}" placeholder="關係，如：兄妹、戀人"><button data-act="rmr" data-i="${i}">✕</button></div>`).join("")}
  <button data-act="addr">＋ 新增關係</button><div class="hint">寫雙方共同的關係名稱即可，對方不需要再設定一次。</div>`;
}
function charBodyEdit(e){
  return `<label>人設</label><textarea data-f="persona" rows="6">${esc(e.persona)}</textarea>
  <label>軼事（可寫多則；內文提到 [[名稱]] 的條目，會一起出現在「軼事」分組裡）</label>

  <button data-act="adda">＋ 新增軼事</button>`+echoEdit(e);

function anecHTML(rows,q){
  const ids=new Set(rows.map(e=>e.id));let out="";
  S.entries.filter(e=>e.type==="角色"&&Array.isArray(e.anec)&&ids.has(e.id)).forEach(o=>o.anec.forEach(a=>{
    const k="軼事|"+o.id+"|"+a.id,shut=S.col[k]&&!q;
    const mem=[o,...S.entries.filter(x=>x.id!==o.id&&ids.has(x.id)&&(a.b||"").includes("[["+x.name+"]]"))];
    out+=`<div class="gh" data-gh="${esc(k)}"><b>${shut?"▸":"▾"} ${esc(a.t||"（無標題）")}</b><span>${esc(o.name)}</span></div>`+(shut?"":mem.map(itemH).join(""));
  }));
  return out||`<div class="empty" style="margin:30px 0">還沒有軼事。在角色編輯頁新增後會出現在這裡。</div>`;
}
function graphHTML(){
  const ch=S.entries.filter(e=>e.type==="角色"),byId=new Map(ch.map(e=>[e.id,e])),edges=new Map(),pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  ch.forEach(e=>(e.rels||[]).forEach(r=>{if(!byId.has(r.to)||r.to===e.id)return;const k=pk(e.id,r.to),o=edges.get(k)||{a:e.id,b:r.to,ls:[],dash:false};if(r.l&&!o.ls.includes(r.l))o.ls.push(r.l);edges.set(k,o)}));
  ch.forEach(e=>{const t=txt(e);ch.forEach(o=>{if(o.id===e.id||!o.name||!t.includes("[["+o.name+"]]"))return;const k=pk(e.id,o.id);if(!edges.has(k))edges.set(k,{a:e.id,b:o.id,ls:[],dash:true})})});
  const es=[...edges.values()];let ids=ch.map(e=>e.id);
  const c0=S.gm!=="all"&&byId.has(S.gc)?S.gc:null;
  if(c0){const seen=new Set([c0]);let fr=[c0];for(let d=0;d<(S.gm==="2"?2:1);d++){const nx=[];es.forEach(x=>{if(fr.includes(x.a)&&!seen.has(x.b)){seen.add(x.b);nx.push(x.b)}else if(fr.includes(x.b)&&!seen.has(x.a)){seen.add(x.a);nx.push(x.a)}});fr=nx}ids=ids.filter(i=>seen.has(i))}
  const fe=es.filter(x=>ids.includes(x.a)&&ids.includes(x.b)),W=720,H=500,n=ids.length,ix=new Map(ids.map((id,i)=>[id,i]));
  const P=ids.map((_,i)=>({x:W/2+Math.cos(i*6.283/n)*Math.min(W,H)*.35,y:H/2+Math.sin(i*6.283/n)*Math.min(W,H)*.35,vx:0,vy:0}));

function popHTML(){
  const p=ED.pop;if(!p)return '';

  if(p.k==='menu'){const d=cdoc();h=it('重新命名作品','bren')+(d?it('上移本章','mvu')+it('下移本章','mvd')+it('複製本章文字','cpdoc')+it('整章重新縮排','reind')+it(ED.conf==='chdel'?'再按一次確認刪除本章':'刪除本章','chdel'):'')+it(ED.conf==='bkdel'?'再按一次確認刪除整部作品':'刪除整部作品','bkdel')}
  else if(p.k==='vmenu'){h=it('在此新建章節','chnew',p.v)+it('重新命名分卷','vren',p.v)+it(ED.conf==='v'+p.v?'再按一次確認刪除':'刪除分卷（章節保留）','vdel',p.v)}
  else if(p.k==='bmenu'){h=S.books.map(b=>it('《'+esc(b.t)+'》','bsw',b.id)).join('')+it('回到作品書架','close')}
  else if(p.k==='mmenu'){h=it('開啟「收藏」頁','tocoll')}

  return `<div class='pop' style='${pos}'>${h}</div>`;
}
function edRender(){
  const e=EDEL;e.className='ed'+(ED.lo?' lo':'')+(ED.ro?' ro':'')+(ED.cfg.dark?' dk':'')+(ED.zen?' zen':'');

  const olBar=d?`<div class='edol'><b>本章大綱</b><span class='olt'>${ED.bind?`<select data-es='bind'><option value=''>（不綁定）</option>${S.outl.filter(o=>o.bk===ED.bk).map(o=>`<option value='${o.id}'${d.ol===o.id?' selected':''}>${esc(o.t||'（無標題）')}</option>`).join('')}</select>`:ol?`<span data-e='rp' data-k='ol' data-v='${ol.id}' style='cursor:pointer'>${esc(ol.t)}${ol.b?'：'+esc(ol.b.slice(0,60)):''}</span>`:`<em style='color:var(--em)'>尚未綁定大綱</em>`}</span><span class='sp'></span><a data-e='olquick'>快速建立</a><a data-e='olbind'>綁定大綱</a></div>`:'';
  e.innerHTML=edSide()+`<section class='edm'><div class='edtb'>${tabs}<span class='sp'></span><button class='ib' data-e='undo' title='復原'>↶</button></div><div class='edc'>${d?`${olBar}<input class='edtitle' data-in='title' value='${esc(d.t)}' placeholder='章節標題'><textarea id='edta' data-in='body' spellcheck='false' placeholder='開始寫吧…'>${esc(d.b)}</textarea>`:`<div class='empty' style='margin-top:20vh'>從左邊選一個章節，或按「新建章節」。</div>`}</div><div class='edst'><span id='edcnt'>${cntText(d)}</span><span class='sp'></span><button class='ib' data-e='fsel' title='把選取的文字（6 字以上）新建成伏筆'>⚑</button><button class='ib' data-e='typo' title='字型與排版'>Aあ</button><button class='ib' data-e='night' title='夜間模式'>☾</button><button class='ib' data-e='zen' title='專注模式'>⛶</button><span id='edclk'>${clock()}</span></div><button class='cn l' data-e='lo'>${ED.lo?'«':'»'}</button><button class='cn r' data-e='ro'>${ED.ro?'»':'«'}</button></section><aside class='edr'>${edRp()}</aside>${popHTML()}<div id='edlg'>${dlgHTML()}</div>`;
  if(ED.pop&&ED.pop.k==='ren'){const i=$('popin');if(i){i.focus();i.select()}}
}

function edCount(){const d=cdoc();if(!d)return;const c=$('edcnt');if(c)c.textContent=cntText(d);const w=EDEL.querySelector(`[data-ch='${d.id}'] .wc`);if(w)w.textContent=d.wc||0}
function edIns(s){const t=$('edta');if(!t){toast('先開啟一個章節');return}t.focus();let ok=false;try{ok=document.execCommand('insertText',false,s)}catch(e){}if(!ok){t.setRangeText(s,t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}}
function cfgSet(t){const k=t.dataset.cfg;ED.cfg[k]=t.type==='checkbox'?t.checked:k==='w'?+t.value:k==='lh'?+t.value/10:k==='fs'?+t.value:t.value;saveCfg();edApply()}
function openEd(id){
  flushW();ED.bk=id;const ds=edDocs();ED.open=[];ED.act=null;ED.rp=null;ED.tab='ch';ED.lo=innerWidth>720;ED.ro=false;ED.zen=false;ED.pop=null;ED.bind=false;ED.conf=null;
  if(ds.length){const last=ds.slice().sort((a,b)=>b.u-a.u)[0];ED.open=[last.id];ED.act=last.id}
  EDEL.hidden=false;edApply();edRender();clearInterval(ED.clk);ED.clk=setInterval(()=>{const c=$('edclk');if(c)c.textContent=clock()},1000);
}
function closeEd(){flushW();saveBooks();clearInterval(ED.clk);EDEL.hidden=true;ED.pop=null;if(S.view==='write')renderWrite()}
function openDoc(id){flushW();if(!ED.open.includes(id))ED.open.push(id);ED.act=id;ED.bind=false;if(innerWidth<=720)ED.lo=false;edRender()}
function mvDoc(dir){const x=cdoc();if(!x)return;const sib=S.docs.filter(z=>z.bk===x.bk&&(z.vol||'')===(x.vol||'')),i=sib.indexOf(x),j=i+dir;if(j<0||j>=sib.length)return;const a=S.docs.indexOf(x),b=S.docs.indexOf(sib[j]);[S.docs[a],S.docs[b]]=[S.docs[b],S.docs[a]];saveDocs()}
function drawShelf(){
  const bs=[...S.books].sort((a,b)=>b.u-a.u);
  $('wbody').innerHTML=`<div class='shelf'>${bs.map(b=>{const ds=S.docs.filter(d=>d.bk===b.id);return `<div class='book' data-x='bkopen' data-v='${b.id}'><div class='bt'>《${esc(b.t||'未命名作品')}》</div><small>${ds.length} 章・${ds.reduce((a,d)=>a+(d.wc||0),0)} 字</small></div>`}).join('')}<div class='book new' data-x='bknew'>＋ 新作品</div></div><p class='hint'>點進作品會開啟寫作畫面。</p>`;

function renderWrite(){

EDEL.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-e]'),inPop=ev.target.closest('.pop');
  if(!t){if(ED.pop&&!inPop){ED.pop=null;ED.conf=null;edRender()}return}
  const d=t.dataset,a=d.e,had=ED.pop&&ED.pop.k,x=ev.clientX,y=ev.clientY;
  if(ED.pop&&!inPop){ED.pop=null;ED.conf=null}
  switch(a){
    case 'close':closeEd();return;
    case 'stab':ED.tab=d.v;if(d.v==='fs'&&!ED.cfg.tipFs)ED.dlg={k:'tip'};break;
    case 'open':openDoc(d.v);return;
    case 'tclose':{const i=ED.open.indexOf(d.v);if(i>=0)ED.open.splice(i,1);if(ED.act===d.v)ED.act=ED.open[Math.min(i,ED.open.length-1)]||null;break}

    case 'vnew':S.vols.push({id:uid(),bk:ED.bk,t:'新分卷'});saveVols();ED.tab='ch';break;
    case 'vtog':ED.coll[d.v]=!ED.coll[d.v];break;
    case 'vmenu':ED.pop={k:'vmenu',v:d.v,x,y};break;
    case 'vren':{const v=S.vols.find(z=>z.id===d.v);ED.pop={k:'ren',val:v?v.t:'',of:'vren:'+d.v,x:8,y:60};break}
    case 'vdel':if(ED.conf!=='v'+d.v){ED.conf='v'+d.v;break}S.docs.forEach(z=>{if(z.vol===d.v)z.vol=''});S.vols=S.vols.filter(z=>z.id!==d.v);saveVols();saveDocs();ED.pop=null;ED.conf=null;break;

    case 'bkmenu':ED.pop={k:'bmenu',x,y};break;

    case 'mvd':mvDoc(1);ED.pop=null;break;
    case 'cpdoc':{const z=cdoc();if(z)copyText(z.b);ED.pop=null;break}
    case 'chdel':{if(ED.conf!=='chdel'){ED.conf='chdel';break}const z=cdoc();if(z){S.docs=S.docs.filter(q=>q.id!==z.id);saveDocs();ED.open=ED.open.filter(q=>q!==z.id);ED.act=ED.open[0]||null}ED.conf=null;ED.pop=null;break}

    case 'popok':{const v=(($('popin')||{}).value||'').trim(),[w,id]=d.v.split(':');if(v){if(w==='vren'){const q=S.vols.find(z=>z.id===id);if(q){q.t=v;saveVols()}}else if(w==='bren'){const b=S.books.find(z=>z.id===ED.bk);if(b){b.t=v;saveBooks()}}}ED.pop=null;break}

    case 'fsnew':{const z={id:uid(),bk:ED.bk,t:'新伏筆',b:'',done:false};S.fore.push(z);saveFore();ED.rp={k:'fs',id:z.id};ED.ro=true;break}

    case 'fsq':case 'fsel':{const ta=$('edta'),q=((a==='fsq'&&ED.pop&&ED.pop.q)||(ta?ta.value.slice(ta.selectionStart,ta.selectionEnd):'')).trim();ED.pop=null;if([...q].length<6){toast('請先選取至少 6 個字');break}const z={id:uid(),bk:ED.bk,t:q.length>16?q.slice(0,16)+'…':q,b:'',q,ch:ED.act,done:false};S.fore.push(z);saveFore();ED.tab='fs';ED.rp={k:'fs',id:z.id};ED.ro=true;if(innerWidth<=720)ED.lo=false;toast('已新建伏筆');break}

    case 'reind':{const z=cdoc();if(z){z.b=z.b.split('\n').map(l=>l.trim()?'\u3000\u3000'+l.replace(/^[ \t\u3000]+/,''):l).join('\n');z.wc=wcount(z.b);z.u=Date.now();saveDocs()}ED.pop=null;toast('已重新縮排');break}
    case 'plnew':ED.dlg={k:'plot',id:null,draft:{t:'',o:'',v:'',c:'',e:'',chars:[],star:0,chs:ED.act?[ED.act]:[],tags:'',col:PCOL[0],note:''}};break;

  const key="[["+e.name+"]]";
  const bl=S.entries.filter(x=>x.id!==e.id&&e.name&&txt(x).includes(key));
  return `<div class="card">
  <div class="head">${e.img?`<img class="portrait" src="${e.img}" alt="">`:""}
    <div><h2>${esc(e.name||"（未命名）")}</h2><span class="badge">${e.type}</span>${["region","family","faction"].filter(k=>e[k]).map(k=>`<span class="badge" style="background:var(--main);color:var(--onmain)">${{region:"📍",family:"👪",faction:"⚑"}[k]} ${esc(e[k]).replace("/"," › ")}</span>`).join("")}${e.tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join("")}</div>

  ${bl.length?`<div class="back">被提到於：${bl.map(x=>link(esc(x.name))).join("、")}</div>`:""}</div>`;

function renderMain(){
  const m=$("main"),e=cur();
  if(S.panel==="backup"){m.innerHTML=backupHTML()+ghHTML();return}
  if(S.panel==="regions"){m.innerHTML=regionsHTML();return}
  if(S.panel==="items"){m.innerHTML=itemsHTML();return}
  if(S.panel==="graph"){m.innerHTML=graphHTML();return}
  if(S.panel==="trash"){m.innerHTML=trashHTML();return}
  if(!e){m.innerHTML=`<div class="empty">從左邊選一個條目，或新增一個。</div>`;return}
  m.innerHTML=S.edit?editHTML(e):viewHTML(e);hydrate();
}

function select(id){if(S.view!=="lib")setView("lib");$("v-lib").dataset.m="main";S.sel=id;S.edit=false;S.panel=null;S.confirm=false;S.tab="info";renderList();renderMain();$("main").scrollTop=0}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-id],[data-new],[data-sel],[data-chip],[data-act],[data-grp],[data-gh],[data-gm],[data-tab],[data-zoom],[data-view]");if(!t)return;
  const d=t.dataset;
  if(d.id||d.new||d.act)ev.preventDefault();
  if(d.id)return select(d.id);
  if(d.new)return create("設定",unesc(d.new));
  if(d.sel)return select(d.sel);
  if(d.chip){S.filter=d.chip;return render()}
  if(d.grp){S.group=d.grp;saveUI();return render()}
  if(d.gm){S.gm=d.gm;return renderMain()}
  if(d.tab){S.tab=d.tab;S.confirm=false;return renderMain()}
  if(d.zoom)return zoom(d.zoom);
  if(d.view)return setView(d.view);
  if(d.gh){S.col[d.gh]=!S.col[d.gh];saveUI();return renderList()}
  const e=cur();
  switch(d.act){
    case"edit":S.edit=true;S.confirm=false;renderMain();break;
    case"done":S.edit=false;S.confirm=false;e.fields=e.fields.filter(f=>f[0]||f[1]);save();render();break;
    case"del":
      if(!S.confirm){S.confirm=true;renderMain();break}
      S.entries=S.entries.filter(x=>x.id!==e.id);save();S.sel=S.entries.length?S.entries[0].id:null;S.confirm=false;render();break;
    case"addf":e.fields.push(["",""]);renderMain();break;
    case"rmf":e.fields.splice(+d.i,1);save();renderMain();break;
    case"img":$("file").click();break;
    case"rmimg":e.img="";save();render();break;
    case"close":S.panel=null;S.confirm=false;renderList();renderMain();break;
    case"graph":SM.sel=e.id;setView("graph");break;
    case"adda":ensureChar(e);e.anec.push({id:uid(),t:"",b:""});save();renderMain();break;
    case"rma":{const k="a"+d.i;if(S.confirm!==k){S.confirm=k;renderMain();break}e.anec.splice(+d.i,1);S.confirm=false;save();renderMain();break}
    case"addr":ensureChar(e);e.rels.push({to:"",l:""});save();renderMain();break;
    case"rmr":e.rels.splice(+d.i,1);save();renderMain();break;
    case"mback":$("v-lib").dataset.m="list";break;
    case"gup":$("gfile").click();break;
    case"gdel":{const k="g"+d.i;if(S.confirm!==k){S.confirm=k;renderMain();break}const g=e.gal[+d.i];if(g){IDB.del(g.id).catch(()=>{});IDB.cache.delete(g.id);syDelAsset(g.aid)}e.gal.splice(+d.i,1);S.confirm=false;save();renderMain();break}
    case"gava":{const g=e.gal[+d.i];if(!g)break;(async()=>{let u=IDB.cache.get(g.id);if(!u){try{u=await IDB.get(g.id)}catch(x){}}if(!u)u=aurl(g.id);if(!u)return;shrink(u,480,r=>{e.img=r;e.updated=Date.now();save();renderMain();renderList();toast("已設為頭像")})})();break}
    case"rgadd":{const c=S.regions[+d.i];c.c.push("新地區"+(c.c.length+1));saveReg();renderMain();break}
    case"cadd":S.regions.push({n:"新大陸"+(S.regions.length+1),c:[]});saveReg();renderMain();break;
    case"rgdel":{
      const i=+d.i,hasJ=d.j!==undefined,key="c"+i+(hasJ?"."+d.j:"");
      if(S.confirm!==key){S.confirm=key;renderMain();break}
      const c=S.regions[i];
      if(hasJ){const p=c.n+"/"+c.c[+d.j];S.entries.forEach(x=>{if(x.region===p)x.region=c.n});c.c.splice(+d.j,1)}
      else{S.entries.forEach(x=>{if(x.region===c.n||(x.region||"").startsWith(c.n+"/"))x.region=""});S.regions.splice(i,1)}
      S.confirm=false;saveReg();save();renderList();renderMain();break}
    case"copy":{const ta=$("bkt");ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(x){}
      $("bkmsg").textContent=ok?"已複製":"請手動全選複製";break}
    case"imp":{
      try{
        const inc=JSON.parse($("bkt").value).entries;if(!Array.isArray(inc))throw 0;
        const map=new Map(S.entries.map(x=>[x.id,x]));inc.forEach(x=>{if(x&&x.id&&x.name!==undefined)map.set(x.id,{type:"其他",tags:[],img:"",fields:[],body:"",updated:Date.now(),...x})});
        S.entries=[...map.values()];save();mergeReg(JSON.parse($("bkt").value).regions);mergeX(JSON.parse($("bkt").value));mergeW(JSON.parse($("bkt").value));mergeT(JSON.parse($("bkt").value));$("bkmsg").textContent="匯入完成，共 "+S.entries.length+" 筆";renderList();
      }catch(x){$("bkmsg").textContent="格式不正確，無法匯入"}
      break}
  }
});
$("main").addEventListener("input",ev=>{
  const t=ev.target,e=cur(),f=t.dataset.f;if(!e||!f)return;
  if(f==="name")e.name=t.value;
  else if(f==="type"){e.type=t.value;if(e.type==="角色")ensureChar(e);save();renderMain()}
  else if(f==="tags")e.tags=t.value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  else if(f==="body")e.body=t.value;
  else if(f==="region"||f==="family"||f==="faction")e[f]=t.value;
  else if(f==="persona")e.persona=t.value;
  else if(f==="at")e.anec[+t.dataset.i].t=t.value;
  else if(f==="ab")e.anec[+t.dataset.i].b=t.value;
  else if(f==="ec"){ensureChar(e);e.ec[+t.dataset.i]=t.value}
  else if(f==="rt")e.rels[+t.dataset.i].to=t.value;
  else if(f==="rl")e.rels[+t.dataset.i].l=t.value;
  else if(f==="gc")e.gal[+t.dataset.i].cat=t.value;
  else if(f==="gt")e.gal[+t.dataset.i].t=t.value;
  else if(f==="gcat"){S.gcat=t.value;return}
  else if(f.startsWith("c.")){const k=f.slice(2);ensureChar(e);e.c[k]=t.value;
    if(k==="hair"||k==="eye"){document.querySelectorAll('[data-f="'+f+'"]').forEach(o=>{if(o===t)return;if(o.type==="color"){const h=hex(t.value);if(h)o.value=h}else o.value=t.value})}
    if(k==="gender"){if(t.value!=="無")e.c.appear="";e.updated=Date.now();save();renderMain();return}}
  else if(f==="fk")e.fields[+t.dataset.i][0]=t.value;
  else if(f==="fv")e.fields[+t.dataset.i][1]=t.value;
  e.updated=Date.now();save();renderList();
});
$("add").addEventListener("change",ev=>{const v=ev.target.value;ev.target.value="";if(v)create(v)});
$("q").addEventListener("input",ev=>{S.q=ev.target.value;renderList()});
$("bk").addEventListener("click",()=>{setView("lib");S.panel="backup";$("v-lib").dataset.m="main";renderList();renderMain()});
$("rg").addEventListener("click",()=>{setView("lib");S.panel="regions";S.confirm=false;$("v-lib").dataset.m="main";renderList();renderMain()});

$("main").addEventListener("change",ev=>{
  const t=ev.target,rn=t.dataset.rn;if(rn===undefined)return;
  const [i,j]=rn.split(".").map(Number),c=S.regions[i],nv=t.value.trim().replace(/\//g,"／");
  if(j===undefined){
    if(!nv||S.regions.some((x,k)=>k!==i&&x.n===nv)){t.value=c.n;return}
    const old=c.n;S.entries.forEach(x=>{const r=x.region||"";if(r===old)x.region=nv;else if(r.startsWith(old+"/"))x.region=nv+r.slice(old.length)});c.n=nv;
  }else{
    if(!nv||c.c.some((x,k)=>k!==j&&x===nv)){t.value=c.c[j];return}
    const op=c.n+"/"+c.c[j];S.entries.forEach(x=>{if(x.region===op)x.region=c.n+"/"+nv});c.c[j]=nv;
  }
  t.value=nv;saveReg();save();renderList();
});
$("theme").addEventListener("click",()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme)}catch(e){}

$("file").addEventListener("change",ev=>{
  const f=ev.target.files[0],e=cur();ev.target.value="";if(!f||!e)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    e.img=c.toDataURL("image/jpeg",.82);e.updated=Date.now();save();render();
  };im.src=r.result};
  r.readAsDataURL(f);
});
/* ===== 遊戲分頁：直接讀取世界庫的角色與軼事 ===== */
const GR={創作者:'多樣化輸出',敘錄使:'記錄、分析',研構使:'構築、戰場變化',典守使:'防護、封存',遺語者:'殘響、輔助'};
let G=null;
function gload(){if(G)return;G=LS.g('-game',null)||{};G.own=G.own||{};G.role=G.role||{};G.dust=G.dust==null?50:G.dust;G.list=G.list||['墨水','舊書','貝殼'];G.day=G.day||{};G.tab=G.tab||'bond';G.msg='';gload2()}
const gsave=()=>{try{LS.s('-game',G)}catch(e){}};
const gchars=()=>S.entries.filter(e=>e.type==='角色');
const glv=o=>Math.min(100,1+Math.floor(o.exp/40),((o.bt||0)+1)*10);
const gunl=(o,i)=>!!o&&(glv(o)>=1+i*2||o.echo>=i+1);
function greact(e,g){const c=e.c||{};return (c.likes||'').includes(g)?['特別喜歡',40]:(c.dislikes||'').includes(g)?['不感興趣',5]:['普通',12]}
function gTab(t){G.tab=t;G.msg='';renderGame()}
function gPull(){const cs=gchars();if(!cs.length){G.msg='世界庫裡還沒有角色。';return renderGame()}if(G.dust<10)return;G.dust-=10;const e=cs[Math.random()*cs.length|0],o=G.own[e.id];
  if(!o){G.own[e.id]={exp:0,echo:0};G.msg='羈絆成立：'+e.name+'。技能組完整，可直接使用。'}else if(o.echo<6){o.echo++;G.msg='故事迴響：'+e.name+' 迴響 '+o.echo+'／6，額外劇情解鎖。'}else{G.dust+=5;G.msg=e.name+' 已滿迴響，轉換為 5 星塵。'}gsave();renderGame()}
function gGift(id,g){const e=gchars().find(x=>x.id===id),o=G.own[id];if(!e||!o||G.dust<2)return;G.dust-=2;const [t,v]=greact(e,g);gexp(o,v);G.msg=e.name+' 對「'+g+'」的反應：'+t+'，羈絆 +'+v;gsave();renderGame()}
function gDaily(id){const o=G.own[id];if(!o||G.day[id]===dayKey())return;G.day[id]=dayKey();gexp(o,8);G.msg='完成今日日常互動，羈絆 +8';gsave();renderGame()}
function gRole(id,v){G.role[id]=v;gsave();renderGame()}
function gAdd(){const v=$('gnew').value.trim();if(v&&!G.list.includes(v)){G.list.push(v);gsave()}renderGame()}
function gStories(e,o){const L=[];if(e.body)L.push(['人物故事・背景',e.body,1]);if(e.c&&e.c.growth)L.push(['人物故事・成長經歷',e.c.growth,3]);(e.anec||[]).forEach((a,i)=>L.push(['軼事・'+(a.t||'（無標題）'),a.b,null,i]));return L}
const CATS=[['人物','人物故事','人物的背景與成長經歷'],['軼事','軼事','角色身上發生過的事'],['地區','地區故事','某個地方的歷史與傳聞'],['事件','事件故事','時間線上發生的事件'],['殘缺','殘缺故事','尚未解鎖的故事'],['特殊','特殊記錄','與世界觀有關的資料']];
function gCat(i){G.cat=i<0?null:CATS[i][0];renderGame()}
function gTheme(v){const r=document.documentElement;try{if(v){r.dataset.theme=v;localStorage.setItem(KEY+'-theme',v)}else{delete r.dataset.theme;localStorage.removeItem(KEY+'-theme')}}catch(e){}}
function gItems(){const ok=[],lock=[];
  gchars().forEach(e=>{const o=G.own[e.id];gStories(e,o).forEach(s=>{const lv=s[2]!=null,cat=lv?'人物':'軼事',pass=lv?(o&&glv(o)>=s[2]):gunl(o,s[3]);
    const t=lv?s[0].replace('人物故事・',''):s[0].replace('軼事・','');
    if(pass)ok.push({cat,t,b:s[1],who:e.name});else lock.push({cat,t:'（尚未解鎖）',need:!o?'先與角色相遇':(lv?'羈絆等級 '+s[2]:'羈絆等級 '+(1+s[3]*2)+' 或迴響 '+(s[3]+1)),who:e.name})})});
  S.entries.forEach(e=>{if(e.type==='角色'||!(e.body||'').trim())return;ok.push({cat:e.type==='地點'?'地區':'特殊',t:e.name,b:e.body,who:e.type})});

  return `<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px'>`+CATS.map((c,i)=>{const n=c[0]==='殘缺'?I.lock.length:I.ok.filter(x=>x.cat===c[0]).length;

/* ===== 戰鬥：用世界庫的角色、地區、事件與物品組成的回合制戰鬥 ===== */
const BTS={創作者:{hp:110,atk:16,def:3},敘錄使:{hp:115,atk:12,def:4},研構使:{hp:120,atk:11,def:5},典守使:{hp:160,atk:9,def:9},遺語者:{hp:125,atk:10,def:4}};
const BTK={創作者:['靈感迸發','對目標造成大量傷害'],敘錄使:['記錄解析','解析全體敵人（受到傷害 +25%，3 回合）並打斷蓄力，再攻擊目標'],研構使:['構築屏障','全隊獲得護盾，並構築戰場：全隊攻擊 +20%（2 回合）'],典守使:['封存之盾','自身獲得大量護盾並嘲諷 2 回合，同時嘗試封存目標（首領機率較低）'],遺語者:['殘響安撫','回復全隊，並賦予殘響：下一次攻擊 +40%']};
let BT=null;
function btInit(){G.bt=G.bt||{cleared:{},team:[]};G.bt.cleared=G.bt.cleared||{};G.bt.team=(G.bt.team||[]).filter(id=>G.own[id])}
function btStages(){const L=[];(S.regions||[]).forEach(c=>c.c.forEach(r=>L.push({k:c.n+'/'+r,name:r,cont:c.n})));return L.length?L:[{k:'default',name:'殘響荒原',cont:''}]}
function btAlly(e){const o=G.own[e.id],r=gRoleOf(e.id),lv=glv(o),p=gpow(e.id,o),B=BTS[r],mhp=Math.round(B.hp*(1+(lv-1)*.06)+p*3);return{id:e.id,name:e.name,role:r,e,hp:mhp,mhp,atk:Math.round(B.atk*(1+(lv-1)*.05)+p*.8),def:Math.round(B.def+lv*.15),sh:0,tank:0,fx:0,defn:false}}
const btAlive=a=>a.filter(x=>x.hp>0);
function btNames(){return [...new Set([...(G.gear||[]),...(G.list||[]),...S.entries.filter(e=>e.type==='其他').map(e=>e.name)])].filter(Boolean)}
function btMk(i,boss,st){
  const lv=3+i*5,ns=btNames(),ev=(S.ev||[]).map(v=>v.t).filter(Boolean);
  const name=boss?(ev.length?'「'+ev[Math.random()*ev.length|0]+'」之影':st.name+'的影之殘響'):(ns.length&&Math.random()<.5?ns[Math.random()*ns.length|0]+'的物靈':st.name+'的殘響');
  const hp=boss?200+lv*25:50+lv*8;
  return{name,boss,mhp:hp,hp,atk:Math.round(boss?8+lv*1.2:5+lv*.9),def:Math.round(boss?4+lv*.5:2+lv*.35),mk:0,seal:0,chg:false};
}
function btStart(i){
  btInit();const st=btStages()[i],team=G.bt.team.map(id=>gchars().find(e=>e.id===id)).filter(Boolean);
  if(!team.length){G.msg='先選擇至少一位出戰角色。';return renderGame()}
  BT={i,st,wave:1,allies:team.map(btAlly),enemies:[btMk(i,false,st),btMk(i,false,st)],sp:3,turn:1,idx:0,tgt:0,buff:0,log:[(st.cont?st.cont+'・':'')+st.name+'：殘響逼近了！'],res:null,rw:null};G.msg='';renderGame();
}
function btToggle(id){btInit();const t=G.bt.team,i=t.indexOf(id);G.msg='';if(i>=0)t.splice(i,1);else if(t.length<4)t.push(id);else G.msg='最多 4 位出戰角色。';gsave();renderGame()}
function btHit(en,d){let x=d;if(en.mk>0)x=Math.round(x*1.25);x=Math.max(1,x-Math.round(en.def*.5));en.hp=Math.max(0,en.hp-x);return x}
function btHurt(al,d){let x=Math.max(1,Math.round(d-al.def*.5));if(al.defn)x=Math.max(1,Math.round(x/2));if(al.sh>0){const a=Math.min(al.sh,x);al.sh-=a;x-=a}al.hp=Math.max(0,al.hp-x);return x}
function btAct(a){
  const b=BT;if(!b||b.res)return;const al=btAlive(b.allies)[b.idx];if(!al)return;
  let tg=b.enemies[b.tgt];if(!tg||tg.hp<=0){tg=btAlive(b.enemies)[0];b.tgt=b.enemies.indexOf(tg)}
  const L=b.log,sg=al.e.c&&al.e.c.sign?'「'+al.e.c.sign+'」':'',bonus=(al.fx>0?1.4:1)*(b.buff>0?1.2:1);
  if(a==='atk'){const d=btHit(tg,Math.round(al.atk*(.9+Math.random()*.2)*bonus));L.push(al.name+' 攻擊 '+tg.name+'，造成 '+d+' 傷害');b.sp=Math.min(5,b.sp+1);al.fx=0}
  else if(a==='def'){al.defn=true;al.sh+=Math.round(al.mhp*.08);L.push(al.name+' 擺出防禦姿態，獲得少量護盾');b.sp=Math.min(5,b.sp+1)}
  else{
    if(b.sp<1)return;b.sp--;const r=al.role;L.push(al.name+(sg?'：'+sg:'')+' 發動「'+BTK[r][0]+'」');
    if(r==='創作者'){const d=btHit(tg,Math.round(al.atk*(1.6+Math.random()*.8)*bonus));L.push('對 '+tg.name+' 造成 '+d+' 傷害');al.fx=0}
    else if(r==='敘錄使'){btAlive(b.enemies).forEach(e=>{e.mk=3;e.chg=false});const d=btHit(tg,Math.round(al.atk*.8*bonus));L.push('解析全體敵人並打斷蓄力；對 '+tg.name+' 造成 '+d+' 傷害');al.fx=0}
    else if(r==='研構使'){btAlive(b.allies).forEach(x=>{x.sh+=Math.round(18+al.atk*1.2)});b.buff=3;L.push('全隊獲得護盾，攻擊 +20%')}
    else if(r==='典守使'){al.sh+=Math.round(30+al.def*3);al.tank=2;if(Math.random()<(tg.boss?.3:.6)){tg.seal=1;L.push(tg.name+' 被封存了')}L.push(al.name+' 獲得護盾並嘲諷')}
    else{btAlive(b.allies).forEach(x=>{x.hp=Math.min(x.mhp,x.hp+Math.round(x.mhp*.2+al.atk*1.2));x.fx=1});L.push('全隊回復，下一次攻擊 +40%')}
  }
  b.idx++;btNext();
}
function btNext(){
  const b=BT;
  if(!btAlive(b.enemies).length){
    if(b.wave===1){b.wave=2;b.enemies=[btMk(b.i,true,b.st)];b.tgt=0;b.log.push('首領現身：'+b.enemies[0].name+'！')}
    else{b.res='ok';btReward();return renderGame()}
  }
  if(b.idx>=btAlive(b.allies).length)btEnemy();
  renderGame();
}
function btEnemy(){
  const b=BT,L=b.log;
  b.enemies.forEach(e=>{
    if(e.hp<=0||b.res)return;
    if(e.seal>0){e.seal--;L.push(e.name+' 被封存，無法行動');return}
    const al=btAlive(b.allies);if(!al.length)return;
    if(e.boss&&e.chg){e.chg=false;let tot=0;al.forEach(x=>{tot+=btHurt(x,e.atk*1.25)});L.push(e.name+' 釋放殘響衝擊，全隊共受到 '+tot+' 傷害！')}
    else if(e.boss&&b.turn%3===2){e.chg=true;L.push(e.name+' 正在蓄力……下一回合將發動全體攻擊')}
    else{const t=al.find(x=>x.tank>0)||al[Math.random()*al.length|0],d=btHurt(t,e.atk*(.9+Math.random()*.2));L.push(e.name+' 攻擊 '+t.name+'，造成 '+d+' 傷害')}
  });
  if(!btAlive(b.allies).length){b.res='no';L.push('隊伍全員倒下了……')}
  else{b.turn++;b.idx=0;b.allies.forEach(x=>{x.defn=false;if(x.tank>0)x.tank--});b.enemies.forEach(e=>{if(e.mk>0)e.mk--});if(b.buff>0)b.buff--}
  if(L.length>12)L.splice(0,L.length-12);
}
function btReward(){
  const b=BT,k=b.st.k,first=!G.bt.cleared[k],dust=first?30+b.i*3:10,ex=10+b.i*3;let drop='';
  G.dust+=dust;b.allies.forEach(a=>{const o=G.own[a.id];if(o)gexp(o,ex)});
  if(first){G.bt.cleared[k]=true;const g='「'+b.st.name+'」之印';if(!G.gear.includes(g)){G.gear.push(g);drop=g}}
  gsave();b.rw={dust,ex,drop,first};
}

  if(b.res==='ok'){const r=b.rw||{};h+=`<p>🎉 勝利！獲得 ${r.dust} 星塵，出戰角色羈絆經驗 +${r.ex}${r.drop?'，首次通關得到裝備「'+esc(r.drop)+'」':''}。</p><button class='pri' data-bt='end'>返回關卡</button>`}
  else if(b.res==='no')h+=`<p>隊伍倒下了。提升羈絆等級、迴響、裝備，或改組隊伍再試。</p><button class='pri' data-bt='start' data-v='${b.i}'>重新挑戰</button><button data-bt='end'>返回</button>`;
  else if(cur)h+=`<p><b>${esc(cur.name)}</b>（${cur.role}）的行動：</p><div class='gr'><button class='pri' data-bt='act' data-v='atk'>攻擊（+1 靈感）</button><button data-bt='act' data-v='skill' ${b.sp<1?'disabled':''}>${BTK[cur.role][0]}（−1 靈感）</button><button data-bt='act' data-v='def'>防禦（+1 靈感）</button></div><div class='gm'>${esc(BTK[cur.role][1])}　點上方敵人可選擇目標。</div>`;
  h+=`<div class='gm' style='margin-top:8px'>${b.log.slice(-8).map(esc).join('<br>')}</div></div>`;
  return h;
}
function btHTML(cs){
  btInit();if(BT)return btBattleHTML();
  const own=cs.filter(e=>G.own[e.id]),team=G.bt.team,st=btStages(),cl=G.bt.cleared;
  let h=`<div class='gc'><b>出戰隊伍（${team.length}／4）</b><div class='gm'>從已羈絆的角色挑選；戰鬥定位決定技能，羈絆等級、迴響與裝備提升能力。</div><div class='gr'>`+(own.length?own.map(e=>{const o=G.own[e.id],on=team.includes(e.id);return `<button class='${on?'pri':''}' data-bt='tog' data-v='${e.id}'>${esc(e.name)}・${gRoleOf(e.id)}　Lv.${glv(o)}</button>`}).join(''):`<span class='gm'>還沒有羈絆角色，先到「尋緣」。</span>`)+`</div></div>`;
  h+=`<h4 style='margin:12px 0 6px'>關卡（依你的地區設定產生）</h4><div class='gg'>`+st.map((s,i)=>{const open=i===0||cl[st[i-1].k];return `<div class='gc'${open?'':` style='opacity:.55'`}><b>${esc(s.name)}</b> <span class='gt'>${'★'.repeat(Math.min(5,1+Math.floor(i/3)))}</span><div class='gm'>${esc(s.cont||'')}　推薦等級約 ${3+i*5}${cl[s.k]?'　✔ 已通關':''}</div><div class='gr'><button class='pri' data-bt='start' data-v='${i}' ${open&&team.length?'':'disabled'}>${open?'出擊':'🔒 先通關前一關'}</button></div></div>`}).join('')+`</div><div class='gm' style='margin-top:10px'>敵人名稱取自你的地區、時間線事件與物品設定；首次通關有星塵，還會得到「地區名」之印紀念裝備。</div>`;
  return h;
}
function renderGame(){
  gload();gcss();const x=$('v-x'),cs=gchars(),T={pull:'尋緣',bond:'羈絆',battle:'戰鬥',story:'圖鑑'};
  let h=`<div class='gw'><div class='gn'>`+Object.entries(T).map(([k,v])=>`<button class='${G.tab===k?'pri':''}' data-bt='tab' data-v='${k}'>${v}</button>`).join('')+`<span class='gm' style='margin-left:auto'>星塵 ${G.dust}　角色 ${cs.length}</span><button data-bt='dust'>每日 +30</button></div>`;
  if(G.msg)h+=`<div class='gm' style='margin-bottom:8px'>${esc(G.msg)}</div>`;
  if(G.tab==='pull')h+=`<div class='gc'><button class='pri' data-bt='pull' ${G.dust<10?'disabled':''}>尋緣（10 星塵）</button><div class='gm' style='margin-top:8px'>從世界庫所有角色中相遇；首次即完整體，重複則為故事迴響。<br>星塵可靠創作獲得：每累計 1000 字 +10、完成一個角色 +30、完成一篇文章（狀態「完成」且 300 字以上）+20。</div></div>`;
  if(G.tab==='bond')h+=gBondHTML(cs);
  if(G.tab==='battle')h+=btHTML(cs);
  if(G.tab==='story')h+=gDexHTML();
  x.innerHTML=h+'</div>';
}
$('v-x').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-bt]');if(!t)return;const a=t.dataset.bt,v=t.dataset.v;gload();
  if(a==='tab')gTab(v);

  else if(a==='pull')gPull();

});
/* ===== GitHub 同步與完整備份檔 ===== */
const GH={cfg:Object.assign({token:'',repo:'',path:'oc-data.json',branch:'main',img:true,auto:false},LS.g('-ghcfg',{})),busy:false,msg:''};
const ghSave=()=>LS.s('-ghcfg',GH.cfg);
function ghMsg(m){GH.msg=m;const el=$('ghmsg');if(el)el.textContent=m}
function b64(s){const u=new TextEncoder().encode(s);let r='';for(let i=0;i<u.length;i+=32768)r+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(r)}
const tsOf=x=>x.updated||x.u||x.ts||x.c||0;
function mgNew(a,b){if(!Array.isArray(b))return a;const m=new Map(a.map(x=>[x.id,x]));b.forEach(x=>{if(!x||!x.id)return;const y=m.get(x.id);if(!y||tsOf(x)>tsOf(y))m.set(x.id,x)});return [...m.values()]}
async function ghBuild(withImg){
  gload();
  const o={v:2,t:Date.now(),entries:S.entries,regions:S.regions,ev:S.ev,coll:S.coll,docs:S.docs,log:S.log,trk:S.trk,books:S.books,vols:S.vols,outl:S.outl,fore:S.fore,think:S.think,plots:S.plots,cpre:S.cpre,game:G};
  if(withImg){o.img={};const ids=[];S.entries.forEach(e=>(e.gal||[]).forEach(g=>ids.push(g.id)));for(const id of ids){let u=IDB.cache.get(id);if(!u){try{u=await IDB.get(id)}catch(e){}}if(u)o.img[id]=u}}
  return o;
}
function ghMergeG(r){
  gload();const a=G;a.dust=Math.max(a.dust||0,r.dust||0);a.own=a.own||{};
  Object.keys(r.own||{}).forEach(id=>{const x=a.own[id],y=r.own[id];if(!x||glv(y)>glv(x))a.own[id]=y});
  ['gear','list'].forEach(k=>{a[k]=[...new Set([...(a[k]||[]),...(r[k]||[])])]});
  a.role=Object.assign({},r.role||{},a.role||{});
  a.bt=a.bt||{cleared:{},team:[]};a.bt.cleared=Object.assign({},(r.bt&&r.bt.cleared)||{},a.bt.cleared||{});
  gsave();
}
async function ghApply(o){
  S.entries=mgNew(S.entries,o.entries);S.ev=mgNew(S.ev,o.ev);S.coll=mgNew(S.coll,o.coll);S.docs=mgNew(S.docs,o.docs);S.books=mgNew(S.books,o.books);S.vols=mgNew(S.vols,o.vols);S.outl=mgNew(S.outl,o.outl);S.fore=mgNew(S.fore,o.fore);S.think=mgNew(S.think,o.think);S.plots=mgNew(S.plots,o.plots);S.cpre=mgNew(S.cpre,o.cpre);
  mergeReg(o.regions);if(Array.isArray(o.trk))o.trk.forEach(n=>{if(!S.trk.includes(n))S.trk.push(n)});
  if(o.log&&o.log.days){Object.keys(o.log.days).forEach(k=>{const a=S.log.days[k],b=o.log.days[k];if(!a||(b.w||0)>(a.w||0))S.log.days[k]=b});if(o.log.goal&&!S.log.goal)S.log.goal=o.log.goal}
  if(o.game)ghMergeG(o.game);
  if(o.img){for(const id of Object.keys(o.img)){if(IDB.cache.has(id))continue;let ex=null;try{ex=await IDB.get(id)}catch(e){}if(!ex){try{await IDB.put(id,o.img[id])}catch(e){}}IDB.cache.set(id,ex||o.img[id])}}
  migDocs();save();saveEv();saveColl();saveDocs();saveBooks();saveVols();saveOutl();saveFore();saveTk();savePl();LS.s('-cpre',S.cpre);saveReg();saveTrk();
}
const ghU=()=>{const c=GH.cfg;return 'https://api.github.com/repos/'+c.repo.trim()+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')};
const ghH=raw=>({'Authorization':'Bearer '+GH.cfg.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghSync(){
  const c=GH.cfg;if(!c.token||!c.repo){ghMsg('請先填寫倉庫與存取權杖。');return}
  if(GH.busy)return;GH.busy=true;ghMsg('同步中…');
  try{
    const q='?ref='+encodeURIComponent(c.branch||'main');let sha=null;
    const m=await fetch(ghU()+q,{headers:ghH(false)});
    if(m.status===404){sha=null}else if(m.ok){sha=(await m.json()).sha}else throw new Error('讀取失敗（'+m.status+'），請檢查倉庫名稱與權杖權限');
    if(sha){const r=await fetch(ghU()+q,{headers:ghH(true)});if(!r.ok)throw new Error('下載失敗（'+r.status+'）');let o=null;try{o=JSON.parse(await r.text())}catch(e){throw new Error('雲端檔案格式不正確')}await ghApply(o)}
    const all=await ghBuild(c.img!==false),body={message:'sync '+new Date().toISOString(),content:b64(JSON.stringify(all)),branch:c.branch||'main'};if(sha)body.sha=sha;
    const w=await fetch(ghU(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH(false)),body:JSON.stringify(body)});
    if(!w.ok){let t='';try{t=(await w.json()).message}catch(e){}throw new Error('上傳失敗（'+w.status+'）'+(t?'：'+t:''))}
    c.last=Date.now();ghSave();ghMsg('已同步 '+new Date().toLocaleTimeString());toast('已與 GitHub 同步');renderTabs();render();
  }catch(e){ghMsg('同步失敗：'+(e.message||e)+'（如果是在 claude.ai 的連結裡，網路請求會被限制，請改在 GitHub 頁面使用）')}
  GH.busy=false;
}
async function ghDownload(){const o=await ghBuild(true),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='世界觀備份-'+dayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);ghMsg('已下載完整備份檔')}
function ghHTML(){
  const c=GH.cfg;
  return `<div class='card' style='margin-top:14px'><strong>GitHub 同步與完整備份</strong><p class='hint'>把資料存到你自己的 GitHub 倉庫，其他裝置填同樣設定就能同步。同步會先下載合併、再上傳，不會覆蓋掉另一台的新資料（刷除的項目不會跨裝置同步）。請用<b>私人</b>倉庫存資料。</p><label>倉庫（例如 帳號/oc-data）</label><input data-gh-in='repo' value='${esc(c.repo)}' placeholder='帳號/倉庫名'><label>存取權杖（Fine-grained token，只給這個倉庫的 Contents 讀寫）</label><input type='password' data-gh-in='token' value='${esc(c.token)}' placeholder='github_pat_…' autocomplete='off'><div class='row' style='flex-wrap:wrap;margin-top:8px'><div style='flex:2;min-width:160px'><label style='margin-top:0'>檔案路徑</label><input data-gh-in='path' value='${esc(c.path)}'></div><div style='flex:1;min-width:100px'><label style='margin-top:0'>分支</label><input data-gh-in='branch' value='${esc(c.branch)}'></div></div><label style='display:flex;gap:6px;align-items:center'><input type='checkbox' data-gh-in='img'${c.img!==false?' checked':''} style='width:auto'> 同步圖片區的圖片（會讓檔案變大）</label><label style='display:flex;gap:6px;align-items:center'><input type='checkbox' data-gh-in='auto'${c.auto?' checked':''} style='width:auto'> 開啟頁面時自動同步</label><div class='row' style='flex-wrap:wrap;margin-top:10px'><button class='pri' data-gh='sync'>立即同步</button><button data-gh='dl'>下載完整備份檔</button><button data-gh='pick'>匯入備份檔</button><input type='file' id='ghfile' accept='.json,application/json' hidden></div><div id='ghmsg' class='hint' style='margin-top:6px'>${esc(GH.msg||(c.last?'上次同步：'+new Date(c.last).toLocaleString():''))}</div><label>或用複製貼上（在不能下載檔案的環境，例如 claude.ai 的連結）</label><div class='row' style='flex-wrap:wrap'><button data-gh='copyall'>複製完整備份（含圖片與遊戲進度）</button><button data-gh='pastein'>貼上匯入</button></div><textarea id='ghpaste' rows='3' placeholder='完整備份文字會出現在這裡；要匯入時貼上後按「貼上匯入」' style='margin-top:6px'></textarea></div>`;
}
$('main').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-gh]');if(!t)return;const a=t.dataset.gh;
  if(a==='sync')ghSync();
  else if(a==='dl')ghDownload();
  else if(a==='pick'){const f=$('ghfile');if(f)f.click()}
  else if(a==='copyall'){ghBuild(true).then(o=>{const ta=$('ghpaste');ta.value=JSON.stringify(o);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ghMsg(ok?'已複製完整備份；到新環境貼上後按「貼上匯入」':'無法自動複製，請在下方文字框全選複製')})}
  else if(a==='pastein'){const ta=$('ghpaste');let o=null;try{o=JSON.parse(ta.value)}catch(e){}if(!o||!o.entries){ghMsg('格式不正確，無法匯入');return}ghApply(o).then(()=>{renderTabs();render();ghMsg('已匯入完整備份');toast('已匯入')})}
});
$('main').addEventListener('input',ev=>{const t=ev.target,k=t.dataset.ghIn;if(!k)return;GH.cfg[k]=t.type==='checkbox'?t.checked:t.value.trim();ghSave()});
$('main').addEventListener('change',ev=>{
  const t=ev.target;if(t.id!=='ghfile')return;const f=t.files[0];t.value='';if(!f)return;
  const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);await ghApply(o);renderTabs();render();ghMsg('已匯入備份檔');toast('已匯入備份檔')}catch(e){ghMsg('匯入失敗：檔案格式不正確')}};r.readAsText(f);
});
setTimeout(()=>{if(GH.cfg.token&&GH.cfg.repo&&GH.cfg.auto)ghSync()},2500);
loadReg();loadX();loadW();loadTK();load();addSeeds();trInit();renderTabs();render();setTimeout(syInit,200);
</script>
